spring.application.name=ProgInz_Seminars2_2026

#konfiguracija ar MySQL
spring.jpa.hibernate.ddl-auto=create
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/miniuniPS
spring.datasource.username=userspringPS3
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name =com.mysql.cj.jdbc.Driver
## lai izveido sakuma tabulas un tad izsauc sql failu
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:insert-data.sql


